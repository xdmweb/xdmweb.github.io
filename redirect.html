<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <script>
        // Opened by XDM 7 as redirect.html?target=chrome|firefox. Always send people to our extension pages,
        // never straight to a store: those pages carry the current store links.
        var str = window.location.search;
        var page = str.indexOf("firefox") != -1 ? "/extension/firefox/"
            : str.indexOf("chrome") != -1 ? "/extension/chrome/"
            : "/extension/";
        window.location.replace(page + "?utm_source=xdm7");
    </script>
</head>
<body>
Redirecting… If nothing happens, go to the <a href="/extension/">XDM browser extension page</a>.
</body>
</html>
